<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-img {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://unsplash.com');
            height: 100%; background-position: center; background-repeat: no-repeat; background-size: cover;
            display: flex; align-items: center; justify-content: center; color: white; text-align: center;
        }
        .content { max-width: 600px; padding: 20px; }
        h1 { font-size: 3.5rem; margin-bottom: 10px; letter-spacing: 2px; }
        p { font-size: 1.2rem; opacity: 0.8; }
        .timer { font-size: 2rem; font-weight: bold; margin-top: 20px; color: #ffcc00; }
    </style>
</head>
<body>
    <div class="bg-img">
        <div class="content">
            <h1>Coming Soon</h1>
            <p>We're working hard to bring you something amazing. Stay tuned!</p>
            <div id="countdown" class="timer"></div>
        </div>
    </div>
</body>
</html>
